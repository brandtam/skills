# release-kit v1 — OPTIONAL companion workflow (repo-agnostic).
#
# Publishes a GitHub Release when a `vX.Y.Z` tag lands, with notes copied from that
# version's CHANGELOG.md section. This is the only downstream step generic enough for
# the kit to offer; deploys/publishes stay repo-specific.
#
# If this repo has its own deploy workflow, fold this job in as its LAST step instead
# (release after a successful deploy), and delete this file.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the GitHub Release

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract this version's CHANGELOG section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver " " { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          if ! [ -s /tmp/notes.md ]; then
            echo "No CHANGELOG.md section for $VERSION — release notes will be minimal." >&2
            echo "See CHANGELOG.md." > /tmp/notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md
